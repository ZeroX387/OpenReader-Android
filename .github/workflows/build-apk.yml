name: Build OpenReader APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Sign APK with permanent OpenReader key
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENREADER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OPENREADER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPENREADER_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openreader-release.p12"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/openreader-release.p12" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out app/build/outputs/apk/debug/app-debug-signed.apk \
            app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify app/build/outputs/apk/debug/app-debug-signed.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenReader-debug
          path: app/build/outputs/apk/debug/app-debug-signed.apk
          if-no-files-found: error
      - name: Publish versioned APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          TAG="v$VERSION"
          FILE="OpenReader-$VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug-signed.apk "$FILE"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "OpenReader $VERSION" --notes "Настройки оформления чтения: цвета страниц, размер текста, интервал и поля. Независимая тема приложения." --prerelease --target "${GITHUB_SHA}"
          fi
          gh release upload "$TAG" "$FILE" --clobber
