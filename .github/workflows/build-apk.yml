name: Build OpenReader APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenReader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OpenReader-0.3-debug.apk
          gh release view v0.3.0 >/dev/null 2>&1 || gh release create v0.3.0 --title "OpenReader 0.3.0 (page reader)" --notes "TXT page turning, HTML cleanup, character position saving. EPUB is not yet supported." --prerelease
          gh release upload v0.3.0 OpenReader-0.3-debug.apk --clobber
